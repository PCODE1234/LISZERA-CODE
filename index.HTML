<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISZERA </title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fcf4f7 0%, #f7e6ed 100%);
            --card-bg: rgba(255, 255, 255, 0.88);
            --header-bg: rgba(255, 255, 255, 0.75);
            --pink-main: #e2a9be;
            --pink-dark: #b86b88;
            --pink-soft: #fff0f5;
            --text-dark: #3a2e35;
            --text-muted: #8c7a83;
            --shadow-soft: 0 10px 25px rgba(184, 107, 136, 0.12);
        }

        * {
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-dark);
        }

        .navbar {
            width: 100%;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 169, 190, 0.3);
            position: sticky;
            top: 0;
            z-index: 990;
            padding: 12px 30px;
            box-shadow: 0 4px 20px rgba(184, 107, 136, 0.08);
        }

        .navbar-content {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: clamp(1.6rem, 3vw, 2.2rem);
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(45deg, #b86b88, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .update-btn {
            background: linear-gradient(135deg, #e2a9be, #b86b88);
            color: #ffffff;
            font-weight: 500;
            font-size: clamp(0.8rem, 1.2vw, 0.9rem);
            letter-spacing: 1px;
            padding: 8px 24px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(184, 107, 136, 0.25);
            transition: all 0.3s ease;
        }

        .update-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(184, 107, 136, 0.35);
        }

        .app-container {
            width: 100%;
            max-width: 1600px;
            padding: 25px 30px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .banner {
            width: 100%;
            height: clamp(140px, 22vw, 340px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: linear-gradient(135deg, #fbe3eb 0%, #f7d6e0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .search-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid rgba(226, 169, 190, 0.4);
            border-radius: 25px;
            padding: 10px 20px;
            flex-grow: 1;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            backdrop-filter: blur(8px);
        }

        .search-icon {
            font-size: 1rem;
            margin-right: 10px;
            color: var(--pink-dark);
            opacity: 0.7;
        }

        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .reviews-btn {
            background: #ffffff;
            color: var(--pink-dark);
            border: 1px solid var(--pink-main);
            font-weight: 500;
            font-size: 0.95rem;
            padding: 10px 24px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(184, 107, 136, 0.08);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .reviews-btn:hover {
            background: var(--pink-soft);
            border-color: var(--pink-dark);
        }

        .grid {
            display: grid;
            width: 100%;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        @media (min-width: 600px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
        }

        @media (min-width: 900px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 22px;
            }
        }

        @media (min-width: 1300px) {
            .grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 24px;
            }
        }

        @media (min-width: 1600px) {
            .grid {
                grid-template-columns: repeat(6, 1fr);
                gap: 25px;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(184, 107, 136, 0.18);
        }

        .card-img-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #fdf8fa;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 4px;
            text-align: center;
            word-break: break-word;
        }

        .card-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 14px;
            text-align: center;
            font-weight: 300;
            word-break: break-word;
        }

        .card-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 8px;
            margin-top: auto;
        }

        .open-btn {
            background: linear-gradient(135deg, #e2a9be, #c9829f);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-align: center;
            padding: 8px 0;
            border-radius: 12px;
            text-decoration: none;
            flex-grow: 1;
            box-shadow: 0 3px 8px rgba(184, 107, 136, 0.2);
            transition: opacity 0.2s;
        }

        .open-btn:hover {
            opacity: 0.9;
        }

        .download-btn {
            background: var(--text-dark);
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            flex-shrink: 0;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: var(--pink-dark);
        }

        .download-icon {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        .loading-text {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
            color: var(--pink-dark);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(58, 46, 53, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: #ffffff;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--pink-soft);
            padding-bottom: 12px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--pink-dark);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .review-list {
            max-height: 260px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .review-item {
            background: var(--pink-soft);
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 0.85rem;
            color: var(--text-dark);
            border-left: 3px solid var(--pink-main);
            word-break: break-word;
        }

        .write-review-btn {
            background: linear-gradient(135deg, #e2a9be, #b86b88);
            color: #ffffff;
            text-align: center;
            padding: 12px;
            border-radius: 14px;
            font-weight: 500;
            font-size: 0.88rem;
            text-decoration: none;
            display: block;
            box-shadow: 0 4px 12px rgba(184, 107, 136, 0.2);
        }

        .passcode-input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(226, 169, 190, 0.6);
            border-radius: 14px;
            font-size: 1rem;
            text-align: center;
            outline: none;
            letter-spacing: 2px;
            background: var(--pink-soft);
        }

        .submit-pass-btn {
            background: linear-gradient(135deg, #e2a9be, #b86b88);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.8rem;
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="navbar-content">
            <h1 class="brand-logo">LISZERA</h1>
            <button class="update-btn" onclick="openUpdateModal()">UPDATE</button>
        </div>
    </nav>

    <div class="app-container">

        <div class="banner">
            <img src="https://lh3.googleusercontent.com/d/1dWFd5LmTcpZg6ucJuXCkYXmvD0TSN0r7" alt="LISZERA Banner"
                onerror="this.style.display='none'">
        </div>

        <div class="search-container">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" onkeyup="filterCards()" placeholder="ค้นหารายการ...">
            </div>
            <button class="reviews-btn" onclick="openReviews()">Reviews</button>
        </div>

        <div class="grid" id="cardContainer">
            <div class="loading-text">✨ กำลังโหลดรายการทั้งหมด...</div>
        </div>

    </div>

    <div class="modal-overlay" id="reviewModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Reviews & Feedback</div>
                <button class="close-btn" onclick="closeReviews()">&times;</button>
            </div>
            <div class="review-list" id="reviewList">
                <div class="review-item">กำลังโหลดรีวิว...</div>
            </div>
            <a href="https://forms.gle/itb78iN1xA3qxhzd7" target="_blank" class="write-review-btn">✨
                รีวิวให้การใช้งาน</a>
        </div>
    </div>

    <div class="modal-overlay" id="updateModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🔒 Password</div>
                <button class="close-btn" onclick="closeUpdateModal()">&times;</button>
            </div>
            <input type="password" id="passcodeInput" class="passcode-input" placeholder="ใส่รหัสผ่าน..."
                onkeyup="checkEnterKey(event)">
            <div class="error-msg" id="errorMsg">❌ คุณไม่ใช้เจ้าของ</div>
            <button class="submit-pass-btn" onclick="verifyPasscode()">ยืนยันเจ้าของเว็ป</button>
        </div>
    </div>

    <script>
        const ITEMS_SHEET_ID = '1WDYDGikQpCPTPkYTHS-WzGkkjAEXRULWLY9uGZXX6fY';
        const REVIEWS_SHEET_ID = '1R1XlFuQQZMvkZxHuE9bHEvcygBtBHrYip6Yj4yxFCiA';
        const UPDATE_FORM_LINK = 'https://forms.gle/8RtpEDStkm4YqHQaA';
        const ADMIN_PASSCODE = '251121';

        let allItems = [];

        function openUpdateModal() {
            document.getElementById('updateModal').style.display = 'flex';
            document.getElementById('passcodeInput').value = '';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('passcodeInput').focus();
        }

        function closeUpdateModal() {
            document.getElementById('updateModal').style.display = 'none';
        }

        function verifyPasscode() {
            const input = document.getElementById('passcodeInput').value;
            const errorMsg = document.getElementById('errorMsg');

            if (input === ADMIN_PASSCODE) {
                closeUpdateModal();
                window.open(UPDATE_FORM_LINK, '_blank');
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function checkEnterKey(event) {
            if (event.key === 'Enter') {
                verifyPasscode();
            }
        }

        function formatImageUrl(url) {
            if (!url) return 'https://via.placeholder.com/300x225/ffffff/cccccc?text=No+Image';

            const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (driveMatch && driveMatch[1]) {
                return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
            }

            return url;
        }

        // แปลงลิงก์ Google Drive ให้เป็น Direct Download ทันที
        function formatDirectDownloadUrl(url) {
            if (!url || url === '#') return '#';

            const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (driveMatch && driveMatch[1]) {
                return `https://drive.google.com/uc?export=download&id=${driveMatch[1]}`;
            }

            return url;
        }

        async function fetchLiszeraData() {
            try {
                const cacheBuster = Date.now();
                const fetchUrl = `https://docs.google.com/spreadsheets/d/${ITEMS_SHEET_ID}/gviz/tq?tqx=out:json&gid=549971443&_t=${cacheBuster}`;

                const response = await fetch(fetchUrl);
                const text = await response.text();
                const jsonText = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);

                if (!jsonText || !jsonText[1]) {
                    document.getElementById('cardContainer').innerHTML = '<div class="loading-text">ไม่พบข้อมูลในระบบ</div>';
                    return;
                }

                const json = JSON.parse(jsonText[1]);
                const rows = json.table.rows;

                allItems = [];

                rows.forEach((row) => {
                    if (!row || !row.c) return;

                    const title = row.c[1]?.v ? String(row.c[1].v).trim() : '';
                    const detail = row.c[2]?.v ? String(row.c[2].v).trim() : 'รายละเอียด';
                    const rawImageUrl = row.c[3]?.v ? String(row.c[3].v).trim() : '';
                    const openUrl = row.c[4]?.v ? String(row.c[4].v).trim() : '#';
                    const rawDownloadUrl = row.c[5]?.v ? String(row.c[5].v).trim() : '#';

                    if (!title || title === 'ชื่อรายการ' || title === 'Timestamp' || title === 'ประทับเวลา') return;

                    const imageUrl = formatImageUrl(rawImageUrl);
                    const downloadUrl = formatDirectDownloadUrl(rawDownloadUrl);

                    allItems.push({ title, detail, imageUrl, openUrl, downloadUrl });
                });

                const searchInput = document.getElementById('searchInput');
                if (!searchInput || searchInput.value.trim() === '') {
                    renderCards(allItems);
                }
            } catch (error) {
                console.error('Error loading item data:', error);
                document.getElementById('cardContainer').innerHTML = '<div class="loading-text">เกิดข้อผิดพลาดในการดึงข้อมูล</div>';
            }
        }

        async function fetchReviewsData() {
            const reviewList = document.getElementById('reviewList');
            try {
                const cacheBuster = Date.now();
                const fetchUrl = `https://docs.google.com/spreadsheets/d/${REVIEWS_SHEET_ID}/gviz/tq?tqx=out:json&_t=${cacheBuster}`;
                const response = await fetch(fetchUrl);
                const text = await response.text();
                const jsonText = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);

                if (!jsonText || !jsonText[1]) {
                    reviewList.innerHTML = '<div class="review-item">ยังไม่มีรีวิวในขณะนี้</div>';
                    return;
                }

                const json = JSON.parse(jsonText[1]);
                const rows = json.table.rows;

                reviewList.innerHTML = '';
                let count = 0;

                rows.forEach((row) => {
                    if (!row || !row.c) return;

                    const reviewText = row.c[1]?.v ? String(row.c[1].v).trim() : '';

                    if (reviewText && reviewText !== 'รีวิว' && reviewText !== 'ข้อเสนอแนะ') {
                        const newReview = document.createElement('div');
                        newReview.className = 'review-item';
                        newReview.innerText = `🤗 ${reviewText}`;
                        reviewList.appendChild(newReview);
                        count++;
                    }
                });

                if (count === 0) {
                    reviewList.innerHTML = '<div class="review-item">ยังไม่มีรีวิวในขณะนี้</div>';
                } else {
                    reviewList.scrollTop = reviewList.scrollHeight;
                }
            } catch (error) {
                console.error('Error loading review data:', error);
                reviewList.innerHTML = '<div class="review-item">ไม่สามารถโหลดข้อมูลรีวิวได้</div>';
            }
        }

        function renderCards(items) {
            const container = document.getElementById('cardContainer');

            if (items.length === 0) {
                container.innerHTML = '<div class="loading-text">ไม่พบรายการที่ค้นหา</div>';
                return;
            }

            container.innerHTML = '';

            items.forEach(item => {
                const cardHTML = `
                    <div class="card">
                        <div class="card-img-box">
                            <img src="${item.imageUrl}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x225/f7e6ed/b86b88?text=Image'">
                        </div>
                        <div class="card-title">${item.title}</div>
                        <div class="card-desc">${item.detail}</div>
                        <div class="card-actions">
                            <a href="${item.openUrl}" target="_blank" class="open-btn">OPEN</a>
                            <a href="${item.downloadUrl}" download class="download-btn">
                                <svg class="download-icon" viewBox="0 0 24 24">
                                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                                </svg>
                            </a>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function filterCards() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allItems.filter(item =>
                item.title.toLowerCase().includes(query) ||
                item.detail.toLowerCase().includes(query)
            );
            renderCards(filtered);
        }

        function openReviews() {
            document.getElementById('reviewModal').style.display = 'flex';
            fetchReviewsData();
        }

        function closeReviews() {
            document.getElementById('reviewModal').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', fetchLiszeraData);
        setInterval(fetchLiszeraData, 10000);
    </script>
</body>

</html>
